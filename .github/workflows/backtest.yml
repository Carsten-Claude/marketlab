name: MarketLab Rückrechnung V5

# Start: Änderung an backtest/auftrag.txt (Claude) oder manuell über „Run workflow“.
# Nutzt die gespeicherten Analystenprognosen, ruft bei Yahoo nur Kurse ab.
on:
  push:
    branches: [main]
    paths: ["backtest/auftrag.txt"]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: marketlab
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m marketlab.backtest_v5
      - name: Ergebnis sichern
        run: |
          git config user.name "marketlab-bot"
          git config user.email "marketlab-bot@users.noreply.github.com"
          git add state/backtest_v5.md state/backtest_v5.json
          git commit -m "Rückrechnung V5 $(date -u +%F)" || echo "keine Änderungen"
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q origin HEAD:main && exit 0; sleep 10; done
          exit 1
