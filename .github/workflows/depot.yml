name: MarketLab Musterdepot

# Buchung per Klick: Die Buttons im Dashboard öffnen ein vorausgefülltes Issue „Depot: Kauf TICKER“ bzw.
# „Depot: Verkauf TICKER“. Jeder Lauf sammelt ALLE offenen Depot-Issues des Repository-Inhabers ein;
# ein Issue wird erst geschlossen, wenn die Buchung gespeichert ist. Verworfene Läufe holt der nächste Lauf nach.
on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: marketlab
  cancel-in-progress: false

jobs:
  book:
    if: github.event.issue.user.login == github.repository_owner && startsWith(github.event.issue.title, 'Depot:')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Offene Depot-Anfragen buchen und Dashboard aktualisieren
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python run.py sweep
      - name: Ergebnis sichern
        run: |
          git config user.name "marketlab-bot"
          git config user.email "marketlab-bot@users.noreply.github.com"
          git add state docs
          git commit -m "Musterdepot $(date -u +%F)" || echo "keine Änderungen"
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q origin HEAD:main && exit 0; sleep 10; done
          exit 1
      - name: Bearbeitete Depot-Anfragen schließen
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python run.py close-issues
