name: MarketLab monatlich

on:
  schedule:
    - cron: "0 3 1 * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: marketlab
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python run.py monthly
      - name: Ergebnis sichern
        run: |
          git config user.name "marketlab-bot"
          git config user.email "marketlab-bot@users.noreply.github.com"
          git add state docs
          git commit -m "Monatslauf $(date -u +%F)" || echo "keine Änderungen"
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q origin HEAD:main && exit 0; sleep 10; done
          exit 1
